<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regularisation Visualizer</title>
  <style>
    :root{color:#0f172a;font-family:sans-serif}body{margin:0;padding:16px;background:#f8fafc;line-height:1.45}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}label{display:grid;gap:5px;font-size:.85rem;font-weight:600;color:#334155}input,select{width:100%;box-sizing:border-box}input[type=range]{accent-color:#2563eb}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}.metric{border:1px solid #dbe4ee;border-radius:5px;background:#fff;padding:8px;font-size:.82rem;color:#475569}.metric strong{display:block;color:#0f172a;font-size:1rem}svg{width:100%;height:auto;display:block;background:#fff;border:1px solid #cbd5e1;border-radius:6px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0;font-size:.84rem;color:#475569}.key{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;background:#2563eb}.key.line{background:#dc2626}.note{margin:12px 0 0;color:#475569;font-size:.85rem}@media(max-width:580px){.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <div class="controls">
    <label>Polynomial degree<select id="degree"><option value="1">1: straight line</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5" selected>5</option><option value="6">6</option><option value="7">7</option></select></label>
    <label>Regularisation strength, lambda <span id="lambda-label">0.010</span><input id="lambda" type="range" min="-4" max="4" value="-2" step="0.1"></label>
  </div>
  <div class="metrics"><div class="metric">Degree<strong id="degree-value">5</strong></div><div class="metric">Lambda<strong id="lambda-value">0.010</strong></div><div class="metric">Training RMSE<strong id="rmse">0.0</strong></div><div class="metric">Weight magnitude<strong id="weights">0.0</strong></div></div>
  <svg viewBox="0 0 700 390" role="img" aria-label="House-price training data and a regularised polynomial model"><rect width="700" height="390" fill="#fff"></rect><line x1="72" y1="322" x2="665" y2="322" stroke="#334155" stroke-width="2"></line><line x1="72" y1="25" x2="72" y2="322" stroke="#334155" stroke-width="2"></line><g id="grid" stroke="#e2e8f0"></g><g id="labels" fill="#475569" font-size="13"></g><text x="365" y="375" text-anchor="middle" fill="#334155" font-size="14">Above-ground living area (m²)</text><text x="18" y="180" text-anchor="middle" fill="#334155" font-size="14" transform="rotate(-90 18 180)">Sale price (thousand USD)</text><path id="model-line" fill="none" stroke="#dc2626" stroke-width="4"></path><g id="points" fill="#2563eb"></g></svg>
  <div class="legend"><span><i class="key"></i>Ames Housing sample</span><span><i class="key line"></i>Ridge polynomial model</span></div>
  <p class="note">Higher lambda values penalise large polynomial weights. Try degree 7 with very low and then high regularisation to see the trade-off between a flexible curve and a smoother model.</p>
  <script>
    const data=[[79.5,208.5],[117.2,181.5],[85.5,223.5],[89.3,140.0],[106.4,250.0],[74,143],[157.4,307]];
    const chart={left:72,right:665,top:25,bottom:322,xMin:60,xMax:170,yMin:100,yMax:340};
    const xPixel=value=>chart.left+(value-chart.xMin)/(chart.xMax-chart.xMin)*(chart.right-chart.left);const yPixel=value=>chart.bottom-(value-chart.yMin)/(chart.yMax-chart.yMin)*(chart.bottom-chart.top);
    const scaledX=x=>(x-115)/55;
    function solve(matrix, vector){const size=vector.length;for(let pivot=0;pivot<size;pivot+=1){let best=pivot;for(let row=pivot+1;row<size;row+=1)if(Math.abs(matrix[row][pivot])>Math.abs(matrix[best][pivot]))best=row;[matrix[pivot],matrix[best]]=[matrix[best],matrix[pivot]];[vector[pivot],vector[best]]=[vector[best],vector[pivot]];const divisor=matrix[pivot][pivot];if(Math.abs(divisor)<1e-10)return Array(size).fill(0);for(let column=pivot;column<size;column+=1)matrix[pivot][column]/=divisor;vector[pivot]/=divisor;for(let row=0;row<size;row+=1){if(row===pivot)continue;const factor=matrix[row][pivot];for(let column=pivot;column<size;column+=1)matrix[row][column]-=factor*matrix[pivot][column];vector[row]-=factor*vector[pivot]}}return vector}
    function fit(degree, lambda){const count=degree+1;const matrix=Array.from({length:count},()=>Array(count).fill(0));const vector=Array(count).fill(0);data.forEach(([x,y])=>{const powers=Array.from({length:count},(_,power)=>scaledX(x)**power);for(let row=0;row<count;row+=1){vector[row]+=powers[row]*y;for(let column=0;column<count;column+=1)matrix[row][column]+=powers[row]*powers[column]}});for(let index=1;index<count;index+=1)matrix[index][index]+=lambda;return solve(matrix,vector)}
    function drawAxes(){for(let value=60;value<=160;value+=20){grid.innerHTML+=`<line x1="${xPixel(value)}" y1="${chart.top}" x2="${xPixel(value)}" y2="${chart.bottom}"></line>`;labels.innerHTML+=`<text x="${xPixel(value)}" y="345" text-anchor="middle">${value}</text>`}for(let value=100;value<=300;value+=50){grid.innerHTML+=`<line x1="${chart.left}" y1="${yPixel(value)}" x2="${chart.right}" y2="${yPixel(value)}"></line>`;labels.innerHTML+=`<text x="58" y="${yPixel(value)+4}" text-anchor="end">${value}</text>`}points.innerHTML=data.map(([x,y])=>`<circle cx="${xPixel(x)}" cy="${yPixel(y)}" r="6"></circle>`).join('')}
    function render(){const degree=Number(document.querySelector('#degree').value);const lambda=10**Number(document.querySelector('#lambda').value);const coefficients=fit(degree,lambda);const predict=x=>coefficients.reduce((total,weight,power)=>total+weight*scaledX(x)**power,0);let path='';for(let x=chart.xMin;x<=chart.xMax;x+=0.5)path+=`${x===chart.xMin?'M':'L'} ${xPixel(x)} ${yPixel(predict(x))} `;document.querySelector('#model-line').setAttribute('d',path);const rmse=Math.sqrt(data.reduce((sum,[x,y])=>sum+(predict(x)-y)**2,0)/data.length);const magnitude=Math.sqrt(coefficients.slice(1).reduce((sum,weight)=>sum+weight**2,0));document.querySelector('#lambda-label').textContent=lambda.toFixed(3);document.querySelector('#lambda-value').textContent=lambda.toFixed(3);document.querySelector('#degree-value').textContent=degree;document.querySelector('#rmse').textContent=rmse.toFixed(1);document.querySelector('#weights').textContent=magnitude.toFixed(1)}
    document.querySelector('#degree').addEventListener('input',render);document.querySelector('#lambda').addEventListener('input',render);drawAxes();render();
  </script>
</body>
</html>
